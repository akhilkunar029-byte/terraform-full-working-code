name: Terraform Infra Provision Project

on:
   workflow_dispatch:
     
   
jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v6              # checkout th code from github to the runner/vm

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4      # installating the terraform

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6   # configuring access and secret keys os aws
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out tfplan

      - name: uploding the artifact 
        uses: actions/upload-artifact@v7
        with:
            name: plan
            path: tfplan

  terraform-apply:
     runs-on: ubuntu-latest
     needs: terraform-plan

     steps:

      - name: Checkout Code
        uses: actions/checkout@v6              # checkout th code from github to the runner/vm

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4      # installating the terraform

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6   # configuring access and secret keys os aws
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate
    
      - name: download the artifact
        uses: actions/download-artifact@v8
        with:
          name: plan
          path: tfplan
      
      - name: Applying th eterraform code 
        run: | 
          terraform apply - auto-approve tfplan
